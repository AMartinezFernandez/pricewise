spring:
  application:
    name: pricewise
  
  # Base de Datos PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pricewise_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    # HikariCP Connection Pool
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      minimum-idle: 5
      maximum-pool-size: 20
      pool-name: PriceWisePool
      leak-detection-threshold: 60000
  
  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 16
    open-in-view: false

  # Flyway - Migraciones de base de datos
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # Perfiles — por defecto PROD (seguro).
  # Para desarrollo local: -Dspring.profiles.active=dev o SPRING_PROFILES_ACTIVE=dev
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

# Configuración del servidor
# PORT es inyectado por Railway/Render/Heroku. Fallback 9090 para local.
server:
  port: ${PORT:9090}
  error:
    include-message: always
    include-binding-errors: always

# =========================================
# JWT Configuration
# =========================================
# IMPORTANTE PARA PRODUCCIÓN:
# - NUNCA usar el secret por defecto en producción
# - Establecer la variable de entorno JWT_SECRET con un valor seguro
# - El secret debe tener al menos 256 bits (32 caracteres)
# - Generar con: openssl rand -base64 32
jwt:
  secret: ${JWT_SECRET:MiClaveSecretaSuperSeguraParaPriceWise2026QueTieneQueTenerAlMenos256Bits}
  expiration: 86400000  # 24 horas en milisegundos

# =========================================
# Google OAuth2 Configuration
# =========================================
google:
  client-id: ${GOOGLE_CLIENT_ID:placeholder}

# =========================================
# CORS Configuration
# =========================================
cors:
  # En desarrollo: true permite cualquier origen (Postman, etc.)
  # En producción: false solo permite orígenes específicos
  allow-all: false
  # Orígenes permitidos en producción (separados por coma)
  allowed-origins: http://localhost:8100,http://localhost:4200,http://localhost:3000

# =========================================
# Keepa API Configuration (Amazon Price Tracking)
# =========================================
# Las API keys de Keepa se gestionan por empresa en la tabla company_api_keys.
# Cada empresa configura su propia API key desde Ajustes > API Keys.
keepa:
  # Locale de Amazon (ES = España, US = USA, DE = Alemania, etc.)
  default-locale: ES
  # Días de historial a solicitar en cada consulta
  history-days: 90
  # Límite de requests por minuto (depende del plan de cada empresa)
  rate-limit: 10

# =========================================
# API Keys Encryption
# =========================================
# Clave AES-256 para cifrar API keys en la DB (exactamente 32 caracteres)
# IMPORTANTE: En producción, configurar variable de entorno API_KEYS_ENCRYPTION_KEY
pricewise:
  api-keys:
    encryption-key: ${API_KEYS_ENCRYPTION_KEY:}

# =========================================
# Actuator (solo health)
# =========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Logging - Nivel base (sobrescrito por perfiles)
logging:
  level:
    root: INFO
    com.alvaro.pricewise: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# =========================================
# Perfil de DESARROLLO
# =========================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

# Contraseñas del seeder (solo perfil dev)
seeder:
  admin-password: ${SEEDER_ADMIN_PASSWORD:Admin123}
  user-password: ${SEEDER_USER_PASSWORD:Password1}

# Override locale Keepa para desarrollo local (override puntual sobre el ES por defecto)
keepa:
  default-locale: US

# CORS permisivo en desarrollo
cors:
  allow-all: true

logging:
  level:
    root: INFO
    com.alvaro.pricewise: DEBUG
    # Reducido para evitar logs excesivos de contraseñas/tokens
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

---
# =========================================
# Perfil de PRODUCCIÓN
# =========================================
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

# JWT sin fallback en producción — obligatorio configurar JWT_SECRET
jwt:
  secret: ${JWT_SECRET}

# Encryption key sin fallback en producción — obligatorio configurar API_KEYS_ENCRYPTION_KEY
pricewise:
  api-keys:
    encryption-key: ${API_KEYS_ENCRYPTION_KEY}

# CORS restrictivo en producción — configurable via env var CORS_ORIGINS (coma-separado)
cors:
  allow-all: false
  allowed-origins: ${CORS_ORIGINS:https://placeholder.invalid}

logging:
  level:
    root: WARN
    com.alvaro.pricewise: INFO
    org.springframework.security: WARN
