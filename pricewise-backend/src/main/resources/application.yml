spring:
  application:
    name: pricewise
  
  # Base de Datos PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pricewise_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    # HikariCP Connection Pool
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      minimum-idle: 5
      maximum-pool-size: 20
      pool-name: PriceWisePool
      leak-detection-threshold: 60000
  
  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 16
    open-in-view: false

  # Flyway - Migraciones de base de datos
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # Perfiles — por defecto PROD (seguro).
  # Para desarrollo local: -Dspring.profiles.active=dev o SPRING_PROFILES_ACTIVE=dev
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

# Configuración del servidor
server:
  port: 9090
  error:
    include-message: always
    include-binding-errors: always

# =========================================
# JWT Configuration
# =========================================
# IMPORTANTE PARA PRODUCCIÓN:
# - NUNCA usar el secret por defecto en producción
# - Establecer la variable de entorno JWT_SECRET con un valor seguro
# - El secret debe tener al menos 256 bits (32 caracteres)
# - Generar con: openssl rand -base64 32
jwt:
  secret: ${JWT_SECRET:MiClaveSecretaSuperSeguraParaPriceWise2026QueTieneQueTenerAlMenos256Bits}
  expiration: 86400000  # 24 horas en milisegundos

# =========================================
# Google OAuth2 Configuration
# =========================================
google:
  client-id: ${GOOGLE_CLIENT_ID:placeholder}

# =========================================
# CORS Configuration
# =========================================
cors:
  # En desarrollo: true permite cualquier origen (Postman, etc.)
  # En producción: false solo permite orígenes específicos
  allow-all: false
  # Orígenes permitidos en producción (separados por coma)
  allowed-origins: http://localhost:8100,http://localhost:4200,http://localhost:3000

# =========================================
# Keepa API Configuration (Amazon Price Tracking)
# =========================================
# IMPORTANTE: Obtener API key en https://keepa.com/#!api
# La clave gratuita tiene límites, considera plan de pago para producción
keepa:
  api-key: ${KEEPA_API_KEY:}
  # Locale de Amazon (ES = España, US = USA, DE = Alemania, etc.)
  default-locale: ES
  # Días de historial a solicitar en cada consulta
  history-days: 90
  # Límite de requests por minuto (depende de tu plan)
  rate-limit: 10

# =========================================
# Actuator (solo health)
# =========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Logging - Nivel base (sobrescrito por perfiles)
logging:
  level:
    root: INFO
    com.alvaro.pricewise: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# =========================================
# Perfil de DESARROLLO
# =========================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

# CORS permisivo en desarrollo
cors:
  allow-all: true

logging:
  level:
    root: INFO
    com.alvaro.pricewise: DEBUG
    # Reducido para evitar logs excesivos de contraseñas/tokens
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

---
# =========================================
# Perfil de PRODUCCIÓN
# =========================================
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

# CORS restrictivo en producción
cors:
  allow-all: false
  # IMPORTANTE: Actualizar con dominios reales de producción
  allowed-origins: https://tudominio.com,https://app.tudominio.com

logging:
  level:
    root: WARN
    com.alvaro.pricewise: INFO
    org.springframework.security: WARN

