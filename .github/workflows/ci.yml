name: PriceWise CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests (Maven)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pricewise-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: mvn -B -ntp test

  android-build:
    name: Android Build + Lint (Gradle)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pricewise-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK platform/build-tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK and run lint
        env:
          GOOGLE_WEB_CLIENT_ID: placeholder
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug -PGOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
